# Curated server & channel map for hands-off, read-only lookup of 3D-printer
# hardware specs, toolhead/component weights, gantry/frame designs, and
# Klipper/Shake&Tune ADXL input-shaper benchmarks.
#
# To add a new server: right-click any channel in Discord -> "Copy Link" to get
#   https://discord.com/channels/<guild_id>/<channel_id>
# then add an entry below (or ask the agent to map its channels).

