# Real-World Machine Input-Shaper Calibration & Regression Benchmark Suite
#
# Curated machine configurations paired with verified real-world Klipper
# SHAPER_CALIBRATE / Shake&Tune ADXL345 measurements. Used by
# `uv run printsim shaper-benchmark` and `tests/test_shaper_benchmarks.py`
# to verify physics accuracy and catch regressions after solver/model edits.
#
# Provenance tiers:
#   tier: 1  Individual measured machine or controlled same-machine A/B experiment
#            with cited ADXL/Klipper shaper logs and known hardware specs.
#   tier: 2  Community multi-build consensus reference spanning diverse printer
#            architectures (3030 CoreXY, Cartesian bedslinger, Delta).
#
# Shaper matching convention:
#   `x_shaper` / `y_shaper` records the exact Klipper shaper reported by the
#   measurement (`ZV`, `MZV`, `EI`, `2HUMP_EI`, `3HUMP_EI`, or `RAW` for raw
#   PSD peak). The runner compares against PrintSim's fitted candidate frequency
#   for that same shaper (or `effective_freq_hz` for `RAW`).

version: 1

machines:
  # =========================================================================
  # TIER 1: Individually Measured Machines & Controlled Experiments
  # =========================================================================

  - id: voron_trident_300_jeffk_hot
    name: Voron Trident 300 (jeff.k, Hot Chamber)
    tier: 1
    architecture: corexy
    base_preset: voron_trident_300.yaml
    overrides:
      frame:
        chamber_temp_c: 55.0
      gantry:
        belt:
          pretension_n: 9.8  # 2.2 lb on PFMakes meter
      kinematics:
        xy_stepper:
          holding_torque_nm: 0.45  # LDO 2004MAH
          rated_current_a: 2.0
          run_current_a: 1.0
    measured:
      x_freq_hz: 62.7
      x_shaper: MZV
      x_range_hz: [61.4, 64.0]
      x_max_accel_mm_s2: 11500
      y_freq_hz: 41.5
      y_shaper: MZV
      y_range_hz: [40.8, 42.2]
      y_max_accel_mm_s2: 4975
    source: "VORONDesign Discord #resonance (jeff.k, 2026-10-20; 20261126_adxl_benchmarks.json)"
    notes: "Stock 300 Trident, LDO 2004MAH, EBB36 Gen2 LIS2DW, hot chamber @ 2.2 lb PFMakes (~9.8 N)."

