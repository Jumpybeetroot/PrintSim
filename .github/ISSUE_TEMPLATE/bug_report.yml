name: Bug Report
description: Report a bug in the 3D Web Studio, physics solver, CLI, or MCP server.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: spec_url
    attributes:
      label: Studio URL or #spec= Share Link
      description: If this happened in the 3D Web Studio, use the Share button and paste the `#spec=` link (or specify the preset name).
      placeholder: "https://jumpybeetroot.github.io/PrintSim/#spec=..."
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Live Web Studio (GitHub Pages / Pyodide WASM)
        - Local Web Studio (`printsim serve`)
        - Python CLI / SDK (`printsim ...`)
        - MCP Server (`printsim mcp`)
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: Browser / OS / Python Version
      placeholder: "e.g., Chrome 131 on macOS 15, or Python 3.12 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: What did you click, edit, or run?
      placeholder: |
        1. Open Base Machine -> ...
        2. Change ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Console / Traceback Output (Optional)
      description: Drag and drop screenshots or paste browser DevTools / terminal errors here.
    validations:
      required: false
