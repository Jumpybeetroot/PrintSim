<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0b0f16" />
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#252f42" stroke-width="1.2" />
  <!-- Isometric printer frame (back edges) -->
  <path
    d="M16 5.5 L25.5 10.7 L25.5 21.3 L16 26.5 L6.5 21.3 L6.5 10.7 Z"
