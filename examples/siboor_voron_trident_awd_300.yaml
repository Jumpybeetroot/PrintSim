name: Siboor Voron Trident June CNC AWD (300)
description: Siboor Voron Trident June 300 kit with GKD 6061-T6 CNC AWD gantry, double-shear pulleys, 9mm Gates 2GT fiberglass belts, 4x OMC 17HS19-2004S XY steppers, HIWIN MGN12H X / Siboor MGN9H Y & Z rails, triple TR8x4 Z with GE5C mounts, StealthBurner + Phaetus Dragon HF
architecture: corexy
frame:
  width_mm: 460
  depth_mm: 460
  height_mm: 500
  profile: extrusion_2020
  material: aluminum_6063_t5
  bracing: corner_gussets
  brace_profile: brace_rod_10mm
  brace_material: aluminum_6063_t5
  enclosed_panels: true
  panel_mounting: clip_enclosure
  panel_material: polycarbonate
  panel_thickness_mm: 3.0
  gantry_top_clearance_mm: 110.0
gantry:
  hardware_kit: siboor_cnc_awd
  drive_mode: awd
  belt_routing: stock_corexy
  double_shear_pulleys: true
  bracket_material: aluminum_6061_t6
  x_beam_profile: extrusion_2020
  x_beam_material: aluminum_6063_t5
  x_rail_profile: mgn12_rail
  y_rail_profile: mgn9_rail
  x_rail_mount: front
  y_rail_mount: bottom
  rail_material: steel_4140
  rail_quality: midgrade_matched
  rail_block_type: H
  dual_x_rails: false
  # Pocketed GKD CNC 6061-T6 AWD XY-joints: 210 g MGN12H-base + 42 g Al delta - 56 g MGN9H pair delta = 196 g dressed
  carriage_mass_g: 210.0
  belt:
    type: gt2_9mm
    core: fiberglass
    pulley_teeth: 20
    pitch_mm: 2.0
    pretension_n: 55.0
kinematics:
  build_volume_mm: [300, 300, 250]
  max_velocity_mm_s: 450
  max_accel_mm_s2: 14000
  max_z_velocity_mm_s: 15
  max_z_accel_mm_s2: 200
  square_corner_velocity_mm_s: 5.0
  input_shaper: auto
  xy_stepper:
    preset_id: stepperonline_2004
    name: OMC 17HS19-2004S (48mm 1.8° 2.0A)
    holding_torque_nm: 0.59
    rated_current_a: 2.0
    run_current_a: 1.4
    phase_resistance_ohm: 1.4
    inductance_mh: 3.0
    steps_per_rev: 200
    supply_voltage_v: 24.0
    rotor_inertia_kg_m2: 8.2e-6
    motor_mass_g: 390
  z_stepper:
    name: NEMA17-42mm Integrated TR8x4 (Siboor)
    holding_torque_nm: 0.45
    rated_current_a: 1.5
    run_current_a: 0.8
    phase_resistance_ohm: 2.3
    inductance_mh: 3.0
    steps_per_rev: 200
    supply_voltage_v: 24.0
    rotor_inertia_kg_m2: 5.4e-6
    motor_mass_g: 290
    body_length_mm: 42.0
toolhead:
  preset_id: stealthburner
  name: Voron StealthBurner + CW2 (Siboor)
  total_mass_g: 398
  cog_offset_mm: [0, -24.0, 16.0]
  nozzle_offset_mm: [0, -34.0, -60.0]
  mount_material: abs_printed
  carriage_mount_material: aluminum_6061_t6
  body_construction: multi_piece_clamshell
  internal_stiffness_n_per_mm: 350.0
  z_probe_type: klicky_inductive
  envelope_mm: [68, 74, 95]
  hotend:
    preset_id: phaetus_dragon_hf
    mount_style: dragon_4bolt_m25
    structural_stiffness_n_per_mm: 550.0
    mass_g: 46.0
    overall_length_mm: 62.2
    name: Phaetus Dragon HF (Blue)
    heater_power_w: 50
    block_material: copper_c110
    block_mass_g: 13
    nozzle_material: brass_c360
    nozzle_diameter_mm: 0.4
    melt_zone_length_mm: 17.5
    heatbreak_material: titanium_grade5
    heatbreak_length_mm: 12
    heatbreak_wall_mm: 0.20
    heatbreak_id_mm: 2.0
    heatsink_thermal_resistance_k_w: 3.4
    part_cooling_cfm: 9.0
    max_temp_c: 350
    ambient_temp_c: 25
  extruder:
    type: direct_drive
    gear_ratio: 5.0
    max_push_force_n: 55
    filament_diameter_mm: 1.75
bed:
  size_mm: [300, 300]
  plate_material: mic6_aluminum
  plate_thickness_mm: 8.0
  heater_power_w: 450
  mass_g: 2800
  z_drive: leadscrew_triple
  z_rail_profile: mgn9_rail
  z_leadscrew_type: tr8x4_pom
  mount_type: trident_3pt_standoffs
