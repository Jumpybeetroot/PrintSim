name: VzBot 330 AWD
description: High-speed VzBot 330 AWD CoreXY with 2020 frame, rear cross bracing, 4mm bolted 5052 aluminum panels, Monolith short-path 9mm fiberglass belts at 65N, high-Tg carbon fiber X-beam, 48V LDO 2804AH steppers, 225g ultra-light CPAP toolhead, 6mm ATP-5 bed, and belt-synced dual-TR8 Z with 4x 10mm smooth rods
architecture: corexy
frame:
  width_mm: 480
  depth_mm: 480
  height_mm: 540
  profile: extrusion_2020
  material: aluminum_6063_t5
  bracing: rear_cross
  brace_profile: brace_rod_10mm
  brace_material: aluminum_6063_t5
  enclosed_panels: true
  panel_mounting: bolted_structural
  panel_material: aluminum_5052_sheet
  panel_thickness_mm: 4.0
gantry:
  drive_mode: awd
  belt_routing: monolith_short
  double_shear_pulleys: true
  bracket_material: aluminum_6061_t6
  x_beam_profile: cf_tube_20x20x2
  x_beam_material: carbon_fiber_high_tg
  x_rail_profile: mgn12_rail
  y_rail_profile: mgn12_rail
  y_rail_mount: inner
  rail_material: steel_4140
  dual_x_rails: false
  carriage_mass_g: 185
  belt:
    type: gt2_9mm
    core: fiberglass
    pulley_teeth: 20
    pitch_mm: 2.0
    pretension_n: 65.0
kinematics:
  build_volume_mm: [330, 330, 300]
  max_velocity_mm_s: 600
  max_accel_mm_s2: 12000
  max_z_velocity_mm_s: 20
  max_z_accel_mm_s2: 250
  square_corner_velocity_mm_s: 10.0
  input_shaper: auto
  xy_stepper:
    preset_id: ldo_2804ah
    name: LDO 42STH48-2804AH 48V
    holding_torque_nm: 0.42
    rated_current_a: 2.8
    run_current_a: 2.0
    phase_resistance_ohm: 0.7
    inductance_mh: 0.6
    steps_per_rev: 200
    supply_voltage_v: 48.0
    rotor_inertia_kg_m2: 6.2e-6
    motor_mass_g: 350
  z_stepper:
    name: NEMA17-42mm Integrated TR8x4
    holding_torque_nm: 0.45
    rated_current_a: 1.5
    inductance_mh: 3.0
    supply_voltage_v: 24.0
    rotor_inertia_kg_m2: 5.4e-6
    motor_mass_g: 290
toolhead:
  preset_id: archetype_cpap
  name: VzBot / Goliath Ultra-Light CPAP
  total_mass_g: 165
  cog_offset_mm: [0, -11, -12]
  nozzle_offset_mm: [0, -14, -48]
  mount_material: aluminum_6061_t6
  body_construction: plate_sandwich_cf
  internal_stiffness_n_per_mm: 1800.0
  z_probe_type: static_eddy
  envelope_mm: [56, 60, 82]
  hotend:
    preset_id: mellow_goliath_air
    mount_style: dragon_4bolt_m25
    structural_stiffness_n_per_mm: 750.0
    overall_length_mm: 69.2
    name: Mellow Goliath Air
    heater_power_w: 100
    block_material: copper_c110
    block_mass_g: 26
    nozzle_material: copper_c110
    nozzle_diameter_mm: 0.4
    melt_zone_length_mm: 50
    heatbreak_material: titanium_grade5
    heatbreak_length_mm: 12
    heatbreak_wall_mm: 0.30
    heatbreak_id_mm: 2.0
    heatsink_thermal_resistance_k_w: 2.8
    part_cooling_cfm: 22.0
    max_temp_c: 400
    ambient_temp_c: 25
  extruder:
    type: direct_drive
    gear_ratio: 6.25
    max_push_force_n: 75
    filament_diameter_mm: 1.75
bed:
  size_mm: [330, 330]
  plate_material: atp5_aluminum
  plate_thickness_mm: 6.0
  heater_power_w: 750
  mass_g: 2450
  z_drive: leadscrew_dual_belt_sync
  z_rail_profile: steel_rod_10mm
  z_leadscrew_type: tr8x4_pom
  mount_type: kinematic_3pt
