name: CoreXY Carbon Truss 300
description: High-acceleration CoreXY with 3030 frame, full 3D truss bracing, carbon fiber X tube, 9 mm fiberglass belts, and ultra-high-flow hotend
architecture: corexy
frame:
  width_mm: 470
  depth_mm: 470
  height_mm: 490
  profile: extrusion_3030
  material: aluminum_6063_t5
  bracing: gussets_and_flat_bars
  brace_profile: brace_rod_10mm
  brace_material: carbon_fiber_tube
  enclosed_panels: true
  panel_thickness_mm: 3.0
gantry:
  x_beam_profile: cf_tube_20x20x2
  x_beam_material: carbon_fiber_tube
  x_rail_profile: mgn9_rail
  y_rail_profile: mgn12_rail
  rail_material: steel_4140
  dual_x_rails: false
  carriage_mass_g: 135
  belt:
    type: gt2_9mm
    core: fiberglass
    pulley_teeth: 20
    pitch_mm: 2.0
    pretension_n: 42.0
kinematics:
  build_volume_mm: [300, 300, 280]
  max_velocity_mm_s: 650
  max_accel_mm_s2: 15000
  max_z_velocity_mm_s: 30
  max_z_accel_mm_s2: 400
  square_corner_velocity_mm_s: 8.0
  input_shaper: auto
  xy_stepper:
    preset_id: custom
    name: NEMA17-60mm 48V High-Speed
    holding_torque_nm: 0.72
    rated_current_a: 2.5
    run_current_a: 2.0
    phase_resistance_ohm: 0.75
    inductance_mh: 1.1
    steps_per_rev: 200
    supply_voltage_v: 48.0
    rotor_inertia_kg_m2: 8.2e-6
    motor_mass_g: 450
toolhead:
  preset_id: custom
  name: Ultra-Light CNC/PA12-CF Toolhead
  total_mass_g: 225
  cog_offset_mm: [0, -14.0, 6.0]
  nozzle_offset_mm: [0, -20.0, -48.0]
  mount_material: pa12_cf_printed
  body_construction: compact_cage
  internal_stiffness_n_per_mm: 800.0
  envelope_mm: [58, 62, 82]
  hotend:
    preset_id: chube_compact
    mount_style: rigid_4bolt_m3
    structural_stiffness_n_per_mm: 2975.0
    overall_length_mm: 47.2
    mass_g: 63.0
    name: Luke's Lab Chube Compact
    heater_power_w: 80
    block_material: copper_c110
    block_mass_g: 18
    nozzle_material: copper_c110
    nozzle_diameter_mm: 0.4
    melt_zone_length_mm: 33
    heatbreak_material: titanium_grade5
    heatbreak_length_mm: 10
    heatbreak_wall_mm: 0.25
    heatbreak_id_mm: 2.0
    heatsink_thermal_resistance_k_w: 2.6
    part_cooling_cfm: 14.0
    max_temp_c: 500
    ambient_temp_c: 25
  extruder:
    type: direct_drive
    gear_ratio: 7.5
    max_push_force_n: 75
    filament_diameter_mm: 1.75
bed:
  size_mm: [300, 300]
  plate_material: mic6_aluminum
  plate_thickness_mm: 8.0
  heater_power_w: 750
  mass_g: 2800
  z_drive: leadscrew_triple
  z_rail_profile: mgn12_rail
  z_leadscrew_type: tr8x4_pom
