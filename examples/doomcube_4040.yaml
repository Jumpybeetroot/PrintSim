name: DoomCube 300 4040 AWD
description: Authentic DoomCube 300 CoreXY with 4040 vertical corner uprights, 2020 horizontal rails & gantry frame, 3-way corner cubes, 4mm bolted Aluminum 5052 structural panels, AWD Monolith short-path 9mm fiberglass belts, CNC 7075 X-beam, A4T + Static Beacon toolhead, and 10mm ATP-5 bed on Whopping Pochard kinematic mount
architecture: corexy
frame:
  width_mm: 500
  depth_mm: 500
  height_mm: 500
  profile: extrusion_2020
  upright_profile: extrusion_4040
  material: aluminum_6063_t5
  bracing: cnc_corner_gussets
  brace_profile: brace_rod_10mm
  brace_material: aluminum_6063_t5
  enclosed_panels: true
  panel_mounting: bolted_structural
  panel_material: aluminum_5052_sheet
  panel_thickness_mm: 4.0
  corner_joint_type: corner_cube
gantry:
  drive_mode: awd
  belt_routing: monolith_short
  double_shear_pulleys: true
  bracket_material: aluminum_7075_t6
  x_beam_profile: cnc_al_beam_20x20
  x_beam_material: aluminum_7075_t6
  x_rail_profile: mgn12_rail
  y_rail_profile: mgn12_rail
  rail_material: steel_4140
  x_rail_mount: front
  y_rail_mount: inner
  rail_preload: Z1
  rail_block_type: H
  dual_x_rails: false
  carriage_mass_g: 205
  belt:
    type: gt2_9mm
    core: fiberglass
    pulley_teeth: 20
    pitch_mm: 2.0
    pretension_n: 65.0
kinematics:
  build_volume_mm: [300, 300, 250]
  max_velocity_mm_s: 650
  max_accel_mm_s2: 20000
  max_z_velocity_mm_s: 20
  max_z_accel_mm_s2: 250
  square_corner_velocity_mm_s: 8.0
  input_shaper: auto
  xy_stepper:
    preset_id: ldo_2804ah
    name: LDO 42STH48-2804AH 48V
    holding_torque_nm: 0.42
    rated_current_a: 2.8
    run_current_a: 2.0
    phase_resistance_ohm: 0.7
    inductance_mh: 0.6
    steps_per_rev: 200
    supply_voltage_v: 48.0
    rotor_inertia_kg_m2: 6.2e-6
    motor_mass_g: 350
  z_stepper:
    name: NEMA17-42mm Integrated TR8x4
    holding_torque_nm: 0.45
    rated_current_a: 1.5
    inductance_mh: 3.0
    supply_voltage_v: 24.0
    rotor_inertia_kg_m2: 5.4e-6
    motor_mass_g: 290
toolhead:
  preset_id: a4t_beacon
  name: A4T + WW-BMG/WWG2 + Static Beacon
  total_mass_g: 298
  cog_offset_mm: [0, -19.0, 8.0]
  nozzle_offset_mm: [0, -28.0, -58.0]
  mount_material: ppa_cf_printed
  body_construction: compact_cage
  internal_stiffness_n_per_mm: 1150.0
  z_probe_type: static_eddy
  envelope_mm: [62, 66, 88]
  hotend:
    preset_id: phaetus_rapido_2_uhf
    mount_style: dragon_4bolt_m25
    structural_stiffness_n_per_mm: 320.0
    overall_length_mm: 79.2
    name: Phaetus Rapido 2 UHF
    heater_power_w: 85
    block_material: copper_c110
    block_mass_g: 17
    nozzle_material: copper_c110
    nozzle_diameter_mm: 0.4
    melt_zone_length_mm: 34
    heatbreak_material: titanium_grade5
    heatbreak_length_mm: 12
    heatbreak_wall_mm: 0.25
    heatbreak_id_mm: 2.0
    heatsink_thermal_resistance_k_w: 2.9
    part_cooling_cfm: 14.0
    max_temp_c: 350
    ambient_temp_c: 25
  extruder:
    type: direct_drive
    gear_ratio: 6.25
    max_push_force_n: 75
    filament_diameter_mm: 1.75
bed:
  size_mm: [300, 300]
  plate_material: atp5_aluminum
  plate_thickness_mm: 10.0
  heater_power_w: 750
  mass_g: 3150
  z_drive: leadscrew_triple
  z_rail_profile: mgn12_rail
  z_leadscrew_type: tr8x4_pom
  mount_type: whopping_pochard_kinematic
